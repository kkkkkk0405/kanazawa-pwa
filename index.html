<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>観光案内ダッシュボード</title>
  <style>
    :root { --bg:#0b1220; --panel:#111827; --muted:#9ca3af; --text:#e5e7eb; --accent:#2563eb; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--text); background: var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif;
    }
    .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100dvh; }
    aside { background: #0f172a; border-right: 1px solid #1f2937; padding: 16px; position: sticky; top: 0; height: 100dvh; overflow: auto; }
    .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    #netDot { font-size: 14px; }
    .ok { color: #10b981; } .warn { color: #f59e0b; }
    .search input { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #1f2937; background: #0b1220; color: var(--text); }
    h3 { font-size: 14px; color: var(--muted); margin: 16px 0 8px; }
    ul.nav { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
    .link { display: block; padding: 10px 12px; border-radius: 10px; border: 1px solid #1f2937; background: #0b1220; cursor: pointer; }
    
    main { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    #statusBar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 5px; }
    .status-item { background: var(--panel); border: 1px solid #1f2937; border-radius: 12px; padding: 8px 16px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
    
    header.mainbar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; border-bottom: 1px solid #1f2937; padding-bottom: 10px; }
    #backBtn { display: none; padding: 6px 14px; background: #1f2937; color: var(--text); border: 1px solid #374151; border-radius: 8px; cursor: pointer; }
    #viewTitle { font-size: 20px; font-weight: 700; }

    .card { background: var(--panel); border: 1px solid #1f2937; border-radius: 14px; padding: 14px; margin: 12px 0; }
    .card h2 { margin: 0 0 8px; font-size: 18px; }
    
    /* ボタンの文字を白くする修正 */
    button.link, .btn {
      color: var(--text) !important;
      width: 100%; text-align: left; cursor: pointer; display: block; padding: 14px;
      background: #0b1220; border: 1px solid #1f2937; border-radius: 12px; margin-bottom: 8px;
    }
    button.link:hover, .btn:hover { border-color: var(--accent); background: #161e2d; }

    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 9999; }
    .lb-inner { max-width: min(600px, 92vw); width: 100%; background: var(--panel); border: 1px solid #1f2937; border-radius: 14px; padding: 12px; }
    #lbImg { width: 100%; max-height: 80vh; object-fit: contain; border-radius: 10px; }

    @media (max-width: 960px) { .app { grid-template-columns: 1fr; } aside { position: static; height: auto; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><strong>案内ダッシュボード</strong> <span id="netDot" class="warn">●</span></div>
      <div class="search"><input id="q" type="search" placeholder="検索" /></div>
      <h3>メインメニュー</h3>
      <ul id="quickLinks" class="nav"></ul>
      <h3>交通案内</h3>
      <ul id="transportLinks__hashiba" class="nav"></ul>
    </aside>
    <main>
      <div id="statusBar">
        <div class="status-item" id="weatherInfo">🕒 天気読み込み中...</div>
        <div class="status-item" id="trainInfo">🚄 新幹線: 正常運行</div>
      </div>
      <header class="mainbar">
        <button id="backBtn">⬅ 戻る</button>
        <div id="viewTitle">ホーム</div>
      </header>
      <section id="view"></section>
    </main>
  </div>
  <div id="lightbox"><div class="lb-inner"><img id="lbImg" /></div></div>
  <script src="./js/weather.js"></script>
  <script src="./js/bus.js"></script>
  <script src="./main.js"></script>
</body>
</html>
