<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>観光案内ダッシュボード</title>

  <!-- PWA用（任意）：用意していれば有効化 -->
  <!-- <link rel="manifest" href="./manifest.webmanifest"> -->
  <!-- <meta name="theme-color" content="#111827"> -->

  <style>
    :root { --bg:#0b1220; --panel:#111827; --muted:#9ca3af; --text:#e5e7eb; --accent:#2563eb; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--text); background: var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .app {
      display: grid; grid-template-columns: 280px 1fr; gap: 0;
      min-height: 100dvh;
    }
    /* サイドバー */
    aside {
      background: #0f172a; border-right: 1px solid #1f2937; padding: 16px; position: sticky; top: 0; align-self: start; height: 100dvh; overflow: auto;
    }
    .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    #netDot { font-size: 14px; }
    .ok { color: #10b981; }    /* online */
    .warn { color: #f59e0b; }  /* offline */
    .search { display: flex; gap: 8px; margin: 12px 0 16px; }
    .search input {
      flex: 1; padding: 10px 12px; border-radius: 12px; border: 1px solid #1f2937; background: #0b1220; color: var(--text);
    }
    h3 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 16px 0 8px; }
    ul.nav { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
    .link {
      display: block; padding: 10px 12px; border-radius: 10px; border: 1px solid #1f2937; background: #0b1220;
    }
    .link:hover { border-color: #334155; background: #0c162a; }

    /* メイン */
    main { padding: 20px; }
    header.mainbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 16px;
    }
    #viewTitle { font-size: 20px; font-weight: 700; }
    #installBtn {
      padding: 8px 12px; border-radius: 10px; border: 1px solid #1f2937;
      background: #0b1220; color: var(--text); cursor: pointer; display: inline-block;
    }
    #installBtn:hover { border-color: #334155; }

    /* カード/ボタン（JSが使うクラス） */
    .card {
      background: var(--panel); border: 1px solid #1f2937; border-radius: 14px;
      padding: 14px; margin: 12px 0;
    }
    .card h2 { margin: 0 0 8px; font-size: 18px; }
    .card p { margin: 0; color: #cbd5e1; }
    .btn {
      margin-top: 10px; padding: 8px 12px; border-radius: 10px;
      border: 1px solid #1f2937; background: #0b1220; color: var(--text); cursor: pointer;
    }
    .btn:hover { border-color: #334155; }

    /* ライトボックス */
    #lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: none; align-items: center; justify-content: center; padding: 24px; z-index: 9999;
    }
    .lb-inner {
      max-width: min(1000px, 92vw); width: 100%;
      background: var(--panel); border: 1px solid #1f2937; border-radius: 14px; padding: 12px;
    }
    .lb-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
    #lbCap { font-size: 14px; color: #cbd5e1; }
    #lbClose { cursor: pointer; border: 1px solid #1f2937; padding: 6px 10px; border-radius: 10px; }
    #lbImg { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #1f2937; }

    /* レスポンシブ */
    @media (max-width: 960px) {
      .app { grid-template-columns: 1fr; }
      aside { position: static; height: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ========== サイドバー ========== -->
    <aside>
      <div class="brand">
        <strong>案内ダッシュボード</strong>
        <span id="netDot" class="warn">●</span>
      </div>

      <div class="search">
        <input id="q" type="search" placeholder="検索（/ または q でフォーカス）" />
      </div>

      <h3>クイックリンク</h3>
      <ul id="quickLinks" class="nav"><!-- JSで挿入 --></ul>

      <h3>交通：橋場町方面</h3>
      <ul id="transportLinks__hashiba" class="nav"><!-- JSで挿入 --></ul>

      <h3>交通：県立図書館</h3>
      <ul id="transportLinks__library" class="nav"><!-- JSで挿入 --></ul>
    </aside>

    <!-- ========== メイン ========== -->
    <main>
      <header class="mainbar">
        <div id="viewTitle">ホーム</div>
        <button id="installBtn" hidden>ホームに追加</button>
      </header>

      <section id="view"><!-- JSでビューを描画 --></section>
    </main>
  </div>

  <!-- ========== ライトボックス ========== -->
  <div id="lightbox" aria-hidden="true">
    <div class="lb-inner">
      <div class="lb-top">
        <div id="lbCap"></div>
        <button id="lbClose" type="button">閉じる</button>
      </div>
      <img id="lbImg" alt="拡大画像" />
    </div>
  </div>

  <!-- あなたが用意したJS（このファイル名に合わせて変更OK） -->
  <script src="./js/bus.js"></script>
  <script src="./main.js"></script>
</body>
</html>
