<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>観光案内ダッシュボード</title>
  <style>
    :root { --bg:#0b1220; --panel:#111827; --muted:#9ca3af; --text:#e5e7eb; --accent:#2563eb; }
    * { box-sizing: border-box; touch-action: manipulation; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0; color: var(--text); background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    
    .app { display: grid; grid-template-columns: 280px 1fr; height: 100dvh; gap: 0; }
    aside { background: #0f172a; border-right: 1px solid #1f2937; padding: 16px; overflow-y: auto; }
    .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: bold; }
    #netDot { font-size: 14px; } .ok { color: #10b981; } .warn { color: #f59e0b; }
    h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin: 16px 0 8px; }
    ul.nav { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
    .link { display: block; padding: 10px 12px; border-radius: 8px; border: 1px solid #1f2937; background: #0b1220; cursor: pointer; }
    .link:hover { border-color: #334155; background: #0c162a; }

    main { padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    #statusBar { display: flex; flex-wrap: wrap; gap: 8px; }
    .status-item { background: var(--panel); border: 1px solid #1f2937; border-radius: 10px; padding: 6px 12px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
    header.mainbar { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid #1f2937; }
    #backBtn { display: none; padding: 6px 12px; background: #1f2937; color: var(--text); border: 1px solid #374151; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    #viewTitle { font-size: 18px; font-weight: 700; flex: 1; }

    .card { background: var(--panel); border: 1px solid #1f2937; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .card h2 { margin: 0 0 6px; font-size: 16px; color: #ffffff; }
    .card p { margin: 0; color: #cbd5e1; font-size: 0.9rem; }
    
    /* ★修正：ボタンの文字を真っ白に。もっとパキッとさせました */
    button.link, .btn {
      color: #ffffff !important; /* 強制的に白 */
      width: 100%; text-align: left; cursor: pointer; display: block; padding: 14px;
      background: #0b1220; border: 1px solid #1f2937; border-radius: 10px; font-size: 1rem;
      margin-bottom: 8px;
    }
    /* ★修正：エラー var(--accent) に直しました */
    button.link:hover, .btn:hover { border-color: var(--accent); background: #161e2d; }

    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 9999; }
    .lb-inner { max-width: 600px; width: 100%; background: var(--panel); border: 1px solid #1f2937; border-radius: 12px; padding: 10px; position: relative; }
    #lbCap { color: #cbd5e1; font-size: 0.8rem; margin-bottom: 8px; text-align: center; }
    #lbImg { width: 100%; max-height: 75vh; object-fit: contain; border-radius: 8px; }

    @media (max-width: 800px) { .app { grid-template-columns: 1fr; } aside { display: none; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">案内ダッシュボード <span id="netDot" class="warn">●</span></div>
      <h3>メニュー</h3>
      <ul id="quickLinks" class="nav"></ul>
      <h3>交通案内</h3>
      <ul id="transportLinks__hashiba" class="nav"></ul>
    </aside>
    <main>
      <div id="statusBar">
        <div class="status-item" id="weatherToday">☀️ 今日: --°C</div>
        <div class="status-item" id="weatherTomorrow">📅 明日: --°C</div>
        <div class="status-item" id="trainStatus" style="cursor:pointer; background:var(--accent);" onclick="openView('shinkansen_top')">
        🚄 運行状況を確認する ❯
      </div>
      </div>
      <header class="mainbar">
        <button id="backBtn">⬅ 戻る</button>
        <div id="viewTitle">ホーム</div>
      </header>
      <section id="view"></section>
    </main>
  </div>
  <div id="lightbox"><div class="lb-inner"><div id="lbCap"></div><img id="lbImg" /></div></div>
  
  <script src="./js/weather.js?v=2"></script>
  <script src="./js/bus.js?v=2"></script>
  <script src="./js/shinkansen.js"></script>
  <script src="./main.js?v=2"></script>
</body>
</html>
